<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Deep Lure</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Georgia',serif; touch-action:none; }
canvas { display:block; }
#ui {
  position:fixed; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:10;
}
#hud {
  position:absolute; top:16px; left:0; width:100%;
  display:flex; justify-content:space-between; align-items:flex-start; padding:0 22px;
}
.hud-block { display:flex; flex-direction:column; gap:3px; }
.hud-lbl { color:rgba(100,200,255,0.42); font-size:10px; letter-spacing:3px; text-transform:uppercase; }
.hud-val { color:rgba(130,215,255,0.92); font-size:26px; letter-spacing:2px; text-shadow:0 0 14px #00bfff; }
#lives { display:flex; gap:5px; margin-top:2px; }
.heart { color:#ff4466; font-size:17px; text-shadow:0 0 8px #ff2244; }
#light-btn {
  position:absolute; bottom:28px; right:28px;
  width:72px; height:72px; border-radius:50%;
  border:2px solid rgba(0,191,255,0.45);
  background:rgba(0,8,18,0.65);
  color:#7fffd4; font-size:10px; letter-spacing:1px; text-transform:uppercase;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  cursor:pointer; pointer-events:all;
  transition:border-color 0.25s, box-shadow 0.25s;
}
#light-btn.on  { border-color:rgba(127,255,212,0.72); box-shadow:0 0 18px rgba(127,255,212,0.38); }
#light-btn.off { border-color:rgba(255,80,80,0.42); box-shadow:none; }
#light-icon { font-size:22px; line-height:1; }
#warning {
  position:absolute; top:38%; left:50%; transform:translate(-50%,-50%);
  text-align:center; pointer-events:none; display:none;
  animation:wPulse 0.45s ease-in-out infinite alternate;
}
#warning h2 { color:#ff2222; font-size:clamp(20px,5vw,38px); letter-spacing:5px; text-shadow:0 0 28px #ff0000,0 0 55px #ff0000; }
#warning p  { color:rgba(255,160,160,0.82); font-size:clamp(10px,2vw,14px); letter-spacing:5px; margin-top:10px; }
@keyframes wPulse { from{opacity:0.55} to{opacity:1} }
.screen {
  position:absolute; top:0; left:0; width:100%; height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(0,3,10,0.93);
}
.screen h1 {
  font-size:clamp(38px,9vw,76px); color:#7fffd4; letter-spacing:6px;
  text-shadow:0 0 30px #00bfff,0 0 60px #00bfff; margin-bottom:10px;
  animation:gPulse 3s ease-in-out infinite;
}
@keyframes gPulse {
  0%,100% { text-shadow:0 0 22px #00bfff,0 0 44px #00bfff; }
  50%      { text-shadow:0 0 42px #00ffaa,0 0 84px #00ffaa,0 0 130px #00bfff; }
}
.tagline { color:rgba(100,200,255,0.55); font-size:clamp(11px,2vw,15px); letter-spacing:3px; text-align:center; margin-bottom:50px; line-height:2.1; padding:0 26px; }
.btn { background:transparent; border:1px solid rgba(0,191,255,0.45); color:#7fffd4; padding:14px 52px; font-size:16px; letter-spacing:4px; cursor:pointer; text-transform:uppercase; font-family:inherit; pointer-events:all; transition:all 0.3s; margin:5px; }
.btn:hover { background:rgba(0,191,255,0.14); border-color:#00bfff; box-shadow:0 0 20px rgba(0,191,255,0.38); color:#fff; }
.score-block { text-align:center; margin:20px 0 46px; }
.score-block .lbl  { color:rgba(100,200,255,0.42); font-size:11px; letter-spacing:4px; display:block; }
.score-block .val  { color:#7fffd4; font-size:clamp(42px,9vw,68px); letter-spacing:4px; display:block; text-shadow:0 0 22px #00bfff; }
.score-block .best { color:rgba(127,255,212,0.52); font-size:14px; letter-spacing:3px; display:block; margin-top:5px; }
#hint {
  position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
  color:rgba(100,200,255,0.32); font-size:11px; letter-spacing:2px; white-space:nowrap;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud">
    <div class="hud-block">
      <span class="hud-lbl">Score</span>
      <span class="hud-val" id="score-val">0</span>
    </div>
    <div class="hud-block" style="align-items:flex-end">
      <span class="hud-lbl">Lives</span>
      <div id="lives"></div>
    </div>
  </div>

  <div id="warning">
    <h2>⚠ PREDATOR DETECTED</h2>
    <p>KILL YOUR LIGHT</p>
  </div>

  <div id="light-btn" class="on">
    <span id="light-icon">◎</span>
    <span>LIGHT</span>
  </div>
  <div id="hint">SPACE · toggle light &nbsp;|&nbsp; mouse / touch · move</div>

  <div class="screen" id="title-screen">
    <h1>DEEP LURE</h1>
    <p class="tagline">Your glow draws the prey.<br>But it also draws the hunters.<br><br>Eat small fish · Avoid predators<br>Turn off your light to hide</p>
    <button class="btn" id="start-btn">Descend</button>
  </div>

  <div class="screen" id="gameover-screen" style="display:none">
    <h1>CONSUMED</h1>
    <div class="score-block">
      <span class="lbl">SCORE</span>
      <span class="val" id="final-score">0</span>
      <span class="best" id="best-score"></span>
    </div>
    <button class="btn" id="restart-btn">Dive Again</button>
  </div>
</div>

<script>
'use strict';

// ─── Canvas ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// ─── State ───────────────────────────────────────────────────────────────────
const S = { TITLE:0, PLAYING:1, GAMEOVER:2 };
let state = S.TITLE;

// ─── Persistence ─────────────────────────────────────────────────────────────
let highScore = (() => { try { return parseInt(localStorage.getItem('dlHS3') || '0'); } catch(e) { return 0; } })();

// ─── Player ──────────────────────────────────────────────────────────────────
const pl = {
  x: 0, y: 0,
  w: 56, h: 48,
  lightOn: true,
  lureGlow: 1,
  lightRadius: 210,
  invincible: 0,
};

// ─── Game state ───────────────────────────────────────────────────────────────
let score = 0;
let lives = 3;
let preyArr   = [];
let particles = [];
let bgDots    = [];
let preyTimer = 0;
let predator  = null;
let predPhase = 'none';   // none | warning | crossing
let predWarnTimer  = 0;
let predEventTimer = 9;
let animT = 0;

// ─── Input ────────────────────────────────────────────────────────────────────
let mouseX = -1, mouseY = -1;
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('touchmove', e => { e.preventDefault(); mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; }, { passive:false });
canvas.addEventListener('touchstart', e => { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; }, { passive:false });
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (state === S.PLAYING) toggleLight(); }
});

// ─── UI ───────────────────────────────────────────────────────────────────────
const lightBtn  = document.getElementById('light-btn');
const lightIcon = document.getElementById('light-icon');
const warningEl = document.getElementById('warning');
const livesEl   = document.getElementById('lives');
const scoreEl   = document.getElementById('score-val');

lightBtn.addEventListener('click', () => { if (state === S.PLAYING) toggleLight(); });

function toggleLight() {
  pl.lightOn = !pl.lightOn;
  lightBtn.className = pl.lightOn ? 'on' : 'off';
  lightIcon.textContent = pl.lightOn ? '◎' : '◉';
}

function updateLivesUI() {
  livesEl.innerHTML = Array(Math.max(0, lives)).fill('<span class="heart">♥</span>').join('');
}

document.getElementById('start-btn').addEventListener('click', () => {
  const ts = document.getElementById('title-screen');
  if (ts) ts.remove();
  startGame();
});
document.getElementById('restart-btn').addEventListener('click', startGame);

// ─── Start / restart ──────────────────────────────────────────────────────────
function startGame() {
  document.getElementById('gameover-screen').style.display = 'none';
  score = 0; lives = 3;
  preyArr.length = 0; particles.length = 0;
  preyTimer = 0;
  predator = null; predPhase = 'none';
  predEventTimer = 9; predWarnTimer = 0;
  pl.x = W * 0.25; pl.y = H * 0.50;
  mouseX = pl.x; mouseY = pl.y;
  pl.lightOn = true; pl.lureGlow = 1; pl.invincible = 0;
  lightBtn.className = 'on'; lightIcon.textContent = '◎';
  warningEl.style.display = 'none';
  initBgDots(); updateLivesUI();
  scoreEl.textContent = '0';
  state = S.PLAYING;
}

function triggerGameOver() {
  state = S.GAMEOVER;
  warningEl.style.display = 'none';
  if (score > highScore) {
    highScore = score;
    try { localStorage.setItem('dlHS3', highScore); } catch(e) {}
  }
  document.getElementById('final-score').textContent = score;
  document.getElementById('best-score').textContent  = `BEST: ${highScore}`;
  document.getElementById('gameover-screen').style.display = 'flex';
}

// ─── Background dots ──────────────────────────────────────────────────────────
function initBgDots() {
  bgDots = [];
  for (let i = 0; i < 90; i++) {
    bgDots.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.5 + 0.3,
      spd: Math.random() * 10 + 3,
      alpha: Math.random() * 0.22 + 0.04,
      hue: 150 + Math.random() * 85,
    });
  }
}

// ─── Prey factory ─────────────────────────────────────────────────────────────
function createPrey() {
  return {
    x: W + 30 + Math.random() * 120,
    y: H * 0.10 + Math.random() * H * 0.80,
    r: 6 + Math.random() * 8,
    speed: 65 + Math.random() * 90,
    hue: 155 + Math.random() * 90,
    pulse: Math.random() * Math.PI * 2,
    vy: (Math.random() - 0.5) * 22,
  };
}

// ─── Particles ────────────────────────────────────────────────────────────────
function spawnParticles(x, y, hue, n) {
  for (let i = 0; i < (n || 10); i++) {
    const a = Math.random() * Math.PI * 2, s = 30 + Math.random() * 60;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 0.45 + Math.random()*0.35, maxLife: 0.8, hue });
  }
}

// ─── Predator event ───────────────────────────────────────────────────────────
function startWarning() {
  predPhase = 'warning'; predWarnTimer = 3.2;
  warningEl.style.display = 'block';
}
function startCrossing() {
  warningEl.style.display = 'none';
  predPhase = 'crossing';
  predator = {
    x: W + 150, y: Math.random() < 0.5 ? H * 0.22 : H * 0.72,
    w: 165, h: 82,
    speed: 85 + Math.min(score * 0.9, 90),
    pulse: 0, tentPhase: 0,
  };
}

// ─── Draw: Background ─────────────────────────────────────────────────────────
function drawBg() {
  ctx.fillStyle = '#010408'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  for (const d of bgDots) {
    ctx.globalAlpha = d.alpha;
    ctx.fillStyle = `hsl(${d.hue},60%,65%)`;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// ─── Draw: Prey fish ──────────────────────────────────────────────────────────
function drawPreyFish(f) {
  const glow = 0.5 + 0.5 * Math.sin(f.pulse);
  const r = f.r;
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(Math.PI); // swims left

  // Tail
  ctx.fillStyle = `hsla(${f.hue},70%,${36+glow*14}%,0.88)`;
  ctx.beginPath();
  ctx.moveTo(-r*1.1, 0);
  ctx.lineTo(-r*2.05, -r*0.84);
  ctx.lineTo(-r*1.90, 0);
  ctx.lineTo(-r*2.05,  r*0.84);
  ctx.closePath(); ctx.fill();

  // Body
  ctx.fillStyle = `hsla(${f.hue},80%,${50+glow*20}%,1)`;
  ctx.beginPath();
  ctx.moveTo(r*1.3, 0);
  ctx.bezierCurveTo(r*1.3,-r*0.62,-r*0.8,-r*0.62,-r*1.1, 0);
  ctx.bezierCurveTo(-r*0.8, r*0.62, r*1.3, r*0.62, r*1.3, 0);
  ctx.fill();

  // Belly shimmer
  ctx.fillStyle = `hsla(${f.hue},60%,${72+glow*12}%,0.26)`;
  ctx.beginPath(); ctx.ellipse(r*0.15, r*0.18, r*0.55, r*0.20, 0.2, 0, Math.PI*2); ctx.fill();

  // Dorsal fin
  ctx.fillStyle = `hsla(${f.hue},68%,${36+glow*12}%,0.82)`;
  ctx.beginPath();
  ctx.moveTo(r*0.20,-r*0.55); ctx.lineTo(r*0.55,-r*0.92); ctx.lineTo(r*0.82,-r*0.55);
  ctx.closePath(); ctx.fill();

  // Eye
  ctx.fillStyle = 'rgba(222,246,255,0.93)';
  ctx.beginPath(); ctx.arc(r*0.74,-r*0.20,r*0.30,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000a14';
  ctx.beginPath(); ctx.arc(r*0.76,-r*0.20,r*0.17,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.80)';
  ctx.beginPath(); ctx.arc(r*0.80,-r*0.25,r*0.07,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // Bioluminescent halo
  const g = ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r*3.2);
  g.addColorStop(0, `hsla(${f.hue},90%,75%,0.30)`);
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x,f.y,r*3.2,0,Math.PI*2); ctx.fill();
}

// ─── Draw: Squid predator ─────────────────────────────────────────────────────
function drawSquid(q) {
  const g2 = 0.4 + 0.3 * Math.sin(q.pulse);
  ctx.save();
  ctx.translate(q.x, q.y);

  // Tentacles (8)
  ctx.lineWidth = 2.8;
  for (let i = 0; i < 8; i++) {
    const ty0 = (i/7 - 0.5) * q.h * 1.05;
    const wave = Math.sin(q.tentPhase + i * 0.95) * 22;
    ctx.strokeStyle = `rgba(185,58,228,${0.48+g2*0.32})`;
    ctx.beginPath();
    ctx.moveTo(-q.w*0.36, ty0);
    ctx.quadraticCurveTo(-q.w*0.36-32+wave*0.4, ty0+14, -q.w*0.36-80, ty0+wave);
    ctx.stroke();
  }

  // Mantle body
  const mg = ctx.createRadialGradient(0,0,6,0,0,q.w*0.44);
  mg.addColorStop(0, 'rgba(178,58,215,0.95)');
  mg.addColorStop(0.55, 'rgba(92,22,132,0.90)');
  mg.addColorStop(1, 'rgba(40,8,65,0.72)');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.ellipse(0,0,q.w*0.38,q.h*0.44,0,0,Math.PI*2); ctx.fill();

  // Tapered tip
  ctx.fillStyle = 'rgba(148,44,184,0.90)';
  ctx.beginPath();
  ctx.moveTo(q.w*0.36,0);
  ctx.bezierCurveTo(q.w*0.52,-q.h*0.18,q.w*0.70,-q.h*0.08,q.w*0.80,0);
  ctx.bezierCurveTo(q.w*0.70, q.h*0.08,q.w*0.52, q.h*0.18,q.w*0.36,0);
  ctx.fill();

  // Fin lobes (side stabilizers)
  ctx.fillStyle = 'rgba(130,40,165,0.70)';
  for (const sy of [-1,1]) {
    ctx.beginPath();
    ctx.moveTo(-q.w*0.12, sy*q.h*0.42);
    ctx.bezierCurveTo(-q.w*0.05, sy*q.h*0.65, q.w*0.10, sy*q.h*0.60, q.w*0.15, sy*q.h*0.42);
    ctx.bezierCurveTo(q.w*0.05, sy*q.h*0.40, -q.w*0.06, sy*q.h*0.40, -q.w*0.12, sy*q.h*0.42);
    ctx.fill();
  }

  // Eyes
  for (const sy of [-q.h*0.22, q.h*0.22]) {
    ctx.fillStyle = `rgba(255,218,38,${0.86+g2*0.10})`;
    ctx.beginPath(); ctx.arc(q.w*0.18,sy,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#08000e';
    ctx.beginPath(); ctx.arc(q.w*0.20,sy,5.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.60)';
    ctx.beginPath(); ctx.arc(q.w*0.22,sy-2,1.8,0,Math.PI*2); ctx.fill();
  }

  // Bioluminescent spots
  for (const [fx,fy] of [[-0.10,-0.24],[0.04,0.18],[-0.22,0.04],[0.14,-0.12]]) {
    ctx.fillStyle = `rgba(220,110,255,${0.22+g2*0.48})`;
    ctx.beginPath(); ctx.arc(fx*q.w,fy*q.h,4.5+g2*3,0,Math.PI*2); ctx.fill();
  }

  // Detection ring when player light is on
  if (pl.lightOn) {
    const ar = ctx.createRadialGradient(0,0,q.w*0.40,0,0,q.w*1.15);
    ar.addColorStop(0, `rgba(255,0,80,${g2*0.20})`);
    ar.addColorStop(1, 'transparent');
    ctx.fillStyle = ar; ctx.beginPath(); ctx.arc(0,0,q.w*1.15,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// ─── Draw: Anglerfish (player) ────────────────────────────────────────────────
function drawAnglerfish() {
  const t = animT;
  if (pl.invincible > 0 && Math.sin(t*18) > 0) return;

  const w = pl.w, h = pl.h;
  const mouthAmt = 0.18 + 0.13 * Math.abs(Math.sin(t * 1.6));
  const tailWag  = Math.sin(t * 4.2) * 0.16;
  const finFlap  = Math.sin(t * 3.2) * 0.28;
  const lureWag  = Math.sin(t * 1.9) * 0.22;

  ctx.save();
  ctx.translate(pl.x, pl.y);
  ctx.scale(0.92, 0.92);

  // ── Tail lobes ──
  ctx.save();
  ctx.translate(-w*0.44, 0); ctx.rotate(tailWag);
  ctx.fillStyle = 'rgba(7,28,44,0.96)';
  for (const sy of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(0, sy*h*0.04);
    ctx.bezierCurveTo(-w*0.09,sy*h*0.22,-w*0.18,sy*h*0.52,-w*0.22,sy*h*0.62);
    ctx.bezierCurveTo(-w*0.10,sy*h*0.38,-w*0.03,sy*h*0.16,0,sy*h*0.04);
    ctx.fill();
  }
  ctx.restore();

  // ── Pectoral fin ──
  ctx.save();
  ctx.translate(w*0.02, h*0.28); ctx.rotate(finFlap*0.42+0.12);
  ctx.fillStyle = 'rgba(10,40,58,0.82)';
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(-2,h*0.32,w*0.10,h*0.62,w*0.26,h*0.44);
  ctx.bezierCurveTo(w*0.28,h*0.20,w*0.10,h*0.07,0,0);
  ctx.fill();
  ctx.restore();

  // ── Main body (round) ──
  const bg = ctx.createRadialGradient(w*0.04,-h*0.06,3,-w*0.04,h*0.04,w*0.55);
  bg.addColorStop(0,'#1d4d68'); bg.addColorStop(0.40,'#0d2838'); bg.addColorStop(1,'#050d1c');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(-w*0.04,0,w*0.42,h*0.44,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(40,105,148,0.28)'; ctx.lineWidth = 1.2; ctx.stroke();

  // ── Dorsal spines ──
  const spX = [-0.22,-0.10, 0.02, 0.12, 0.20];
  const spH = [ 0.52, 0.68, 0.58, 0.46, 0.35];
  for (let i = 0; i < spX.length; i++) {
    const bx  = w * spX[i];
    const nX  = (spX[i] + 0.04) / 0.42;
    const bY  = -h * 0.44 * Math.sqrt(Math.max(0, 1 - nX*nX));
    const tY  = bY - h * spH[i];
    ctx.fillStyle = 'rgba(12,50,72,0.93)';
    ctx.strokeStyle = 'rgba(28,80,110,0.55)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bx-w*0.030,bY); ctx.lineTo(bx,tY); ctx.lineTo(bx+w*0.030,bY);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  // ── Mouth void ──
  ctx.fillStyle = '#030910';
  ctx.beginPath();
  ctx.moveTo(w*0.20,-h*0.10);
  ctx.bezierCurveTo(w*0.44,-h*0.08,w*0.52,h*0.22,w*0.36,h*0.44);
  ctx.bezierCurveTo(w*0.16,h*0.48,w*0.02,h*0.32,w*0.20,-h*0.10);
  ctx.fill();

  // ── Upper jaw + teeth ──
  ctx.save();
  ctx.translate(w*0.20,-h*0.10); ctx.rotate(-mouthAmt*0.62);
  ctx.fillStyle = '#0c1f30';
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(w*0.24,-h*0.02,w*0.30,-h*0.12,w*0.25,-h*0.22);
  ctx.bezierCurveTo(w*0.12,-h*0.26,w*0.02,-h*0.14,0,0);
  ctx.fill();
  ctx.fillStyle = 'rgba(205,240,232,0.94)';
  for (let i = 0; i < 10; i++) {
    const tx = w*0.24*(i/9), tl = h*(i%2===0?0.20:0.12);
    ctx.beginPath(); ctx.moveTo(tx-1.6,0); ctx.lineTo(tx,tl); ctx.lineTo(tx+1.6,0);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // ── Lower jaw + teeth ──
  ctx.save();
  ctx.translate(w*0.20,-h*0.10); ctx.rotate(mouthAmt*0.88);
  ctx.fillStyle = '#0c1f30';
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(w*0.28,h*0.08,w*0.34,h*0.30,w*0.18,h*0.50);
  ctx.bezierCurveTo(w*0.02,h*0.48,-w*0.04,h*0.28,0,0);
  ctx.fill();
  ctx.fillStyle = 'rgba(188,228,218,0.90)';
  for (let i = 0; i < 9; i++) {
    const tx = w*0.24*(i/8), tl = h*(i%2===0?0.17:0.10);
    ctx.beginPath(); ctx.moveTo(tx-1.5,0); ctx.lineTo(tx,-tl); ctx.lineTo(tx+1.5,0);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // ── Eye ──
  ctx.fillStyle = 'rgba(200,238,255,0.94)';
  ctx.beginPath(); ctx.arc(w*0.16,-h*0.26,7,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#00060e';
  ctx.beginPath(); ctx.arc(w*0.175,-h*0.255,4.6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.72)';
  ctx.beginPath(); ctx.arc(w*0.190,-h*0.272,1.5,0,Math.PI*2); ctx.fill();

  // ── Lure stalk ──
  const baseX = w*0.10, baseY = -h*0.44;
  const cp1x = baseX-w*0.04, cp1y = baseY-h*0.58;
  const cp2x = baseX+w*0.02+Math.sin(lureWag)*8, cp2y = baseY-h*1.10;
  const lureX = baseX+Math.sin(lureWag)*12, lureY = baseY-h*1.05+Math.cos(lureWag)*6;

  ctx.strokeStyle = 'rgba(18,62,88,0.90)'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(baseX,baseY);
  ctx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,lureX,lureY); ctx.stroke();

  if (pl.lureGlow > 0.02) {
    const ls = 13 * pl.lureGlow;
    const lg = ctx.createRadialGradient(lureX,lureY,0,lureX,lureY,ls*1.7);
    lg.addColorStop(0,`rgba(145,255,215,${pl.lureGlow})`);
    lg.addColorStop(0.4,`rgba(60,210,185,${pl.lureGlow*0.60})`);
    lg.addColorStop(1,'transparent');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(lureX,lureY,ls*1.7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = `rgba(230,255,248,${pl.lureGlow})`;
    ctx.beginPath(); ctx.arc(lureX,lureY,3.5,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// ─── Draw: Darkness overlay ───────────────────────────────────────────────────
function drawDarkness() {
  if (pl.lureGlow < 0.01) {
    ctx.fillStyle = 'rgba(0,2,8,0.97)';
    ctx.fillRect(0,0,W,H);
    return;
  }
  const r = pl.lightRadius * pl.lureGlow;
  const gr = ctx.createRadialGradient(pl.x,pl.y,r*0.05,pl.x,pl.y,r);
  gr.addColorStop(0.00,'rgba(0,2,8,0.00)');
  gr.addColorStop(0.48,'rgba(0,2,8,0.18)');
  gr.addColorStop(0.70,'rgba(0,2,8,0.70)');
  gr.addColorStop(0.88,'rgba(0,2,8,0.90)');
  gr.addColorStop(1.00,'rgba(0,2,8,0.97)');
  ctx.fillStyle = gr; ctx.fillRect(0,0,W,H);

  // Additive bloom ring at light edge
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const bloom = ctx.createRadialGradient(pl.x,pl.y,r*0.55,pl.x,pl.y,r*1.35);
  const b = Math.floor(140 * pl.lureGlow);
  bloom.addColorStop(0,'rgba(0,0,0,0)');
  bloom.addColorStop(0.5,`rgba(0,${b},${Math.floor(b*0.7)},${0.14*pl.lureGlow})`);
  bloom.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = bloom; ctx.beginPath(); ctx.arc(pl.x,pl.y,r*1.35,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ─── Main loop ────────────────────────────────────────────────────────────────
let lastTime = 0;

function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts; animT = ts / 1000;

  // ── Update ──────────────────────────────────────────────────────────────
  if (state === S.PLAYING) {

    // Player follows cursor with smooth lerp
    if (mouseX >= 0) {
      pl.x += (mouseX - pl.x) * 0.075;
      pl.y += (mouseY - pl.y) * 0.075;
    }
    pl.x = Math.max(pl.w*0.5, Math.min(W-pl.w*0.5, pl.x));
    pl.y = Math.max(pl.h*0.5, Math.min(H-pl.h*0.5, pl.y));

    // Lure glow fades in/out
    if (pl.lightOn) pl.lureGlow = Math.min(1, pl.lureGlow + dt*3.5);
    else            pl.lureGlow = Math.max(0, pl.lureGlow - dt*4.5);

    // Invincibility frames
    if (pl.invincible > 0) pl.invincible -= dt;

    // Spawn prey
    preyTimer -= dt;
    if (preyTimer <= 0) {
      const wave = Math.min(1 + Math.floor(score / 12), 3);
      for (let i = 0; i < wave; i++) preyArr.push(createPrey());
      preyTimer = 0.75 + Math.random() * 1.25;
    }

    // Update prey
    for (let i = preyArr.length - 1; i >= 0; i--) {
      const f = preyArr[i];
      f.x -= f.speed * dt;
      f.y += f.vy * dt;
      if (f.y < f.r)     { f.y = f.r;     f.vy =  Math.abs(f.vy); }
      if (f.y > H - f.r) { f.y = H - f.r; f.vy = -Math.abs(f.vy); }
      f.pulse += dt * 2.8;
      // Eat: mouth is on the right (+x) of the player
      const mouthX = pl.x + pl.w * 0.40;
      if (Math.hypot(f.x - mouthX, f.y - pl.y) < f.r + 22) {
        spawnParticles(f.x, f.y, f.hue, 10);
        score++; scoreEl.textContent = score;
        preyArr.splice(i, 1); continue;
      }
      if (f.x < -70) preyArr.splice(i, 1);
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= 0.88; p.vy *= 0.88;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Background drift
    for (const d of bgDots) {
      d.x -= d.spd * dt;
      if (d.x < -5) { d.x = W+5; d.y = Math.random()*H; }
    }

    // Predator event timer
    if (predPhase === 'none') {
      predEventTimer -= dt;
      if (predEventTimer <= 0) {
        startWarning();
        predEventTimer = Math.max(6, 11 + Math.random()*8 - score*0.25);
      }
    }

    // Predator state machine
    if (predPhase === 'warning') {
      predWarnTimer -= dt;
      if (predWarnTimer <= 0) startCrossing();
    } else if (predPhase === 'crossing' && predator) {
      predator.x -= predator.speed * dt;
      predator.pulse     += dt * 1.9;
      predator.tentPhase += dt * 3.8;

      // Only collides when player light is on (predator detects light)
      if (pl.lightOn && pl.invincible <= 0) {
        const dx = Math.abs(predator.x - pl.x);
        const dy = Math.abs(predator.y - pl.y);
        if (dx < predator.w*0.46 + pl.w*0.36 && dy < predator.h*0.45 + pl.h*0.38) {
          lives--; updateLivesUI(); pl.invincible = 1.8;
          predPhase = 'none'; predator = null;
          if (lives <= 0) { triggerGameOver(); return; }
        }
      }
      if (predator && predator.x < -predator.w - 30) {
        predPhase = 'none'; predator = null;
      }
    }
  }

  // ── Draw ──────────────────────────────────────────────────────────────────
  drawBg();

  if (state === S.PLAYING) {
    // Prey (drawn before darkness — darkened by overlay unless in light)
    for (const f of preyArr) drawPreyFish(f);

    // Eat particles
    for (const p of particles) {
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = `hsl(${p.hue},80%,65%)`;
      ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Predator (drawn before darkness — barely visible unless close to light)
    if (predPhase === 'crossing' && predator) drawSquid(predator);

    // Darkness overlay (light halo effect)
    drawDarkness();

    // Player drawn on top of darkness
    drawAnglerfish();

    // Red vignette flash during predator warning
    if (predPhase === 'warning') {
      const fl = 0.10 + 0.08 * Math.sin(animT * 9);
      ctx.fillStyle = `rgba(255,20,20,${fl})`;
      ctx.fillRect(0,0,W,H);
    }
  }
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
pl.x = W * 0.25; pl.y = H * 0.50;
mouseX = pl.x; mouseY = pl.y;
requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(loop); });
</script>
</body>
