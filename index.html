<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Deep Lure</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Georgia', serif;
    touch-action: none;
  }
  canvas { display: block; }
  #ui {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }
  #hud {
    position: absolute;
    top: 20px; left: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bar-label {
    color: rgba(100,200,255,0.6);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .bar-container {
    width: 140px;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
  }
  #energy-bar {
    height: 100%;
    background: linear-gradient(90deg, #00bfff, #7fffd4);
    border-radius: 3px;
    transition: width 0.1s;
    box-shadow: 0 0 6px #00bfff;
  }
  #score-display {
    position: absolute;
    top: 20px; right: 20px;
    text-align: right;
    color: rgba(100,200,255,0.7);
    font-size: 13px;
    letter-spacing: 2px;
  }
  #score-display .score-val {
    font-size: 28px;
    color: rgba(150,220,255,0.9);
    display: block;
    text-shadow: 0 0 12px #00bfff;
  }
  #score-display .timer-val {
    font-size: 16px;
    display: block;
    margin-top: 2px;
  }
  /* Overlay screens */
  .screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,5,15,0.88);
    pointer-events: all;
    transition: opacity 0.5s;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }
  .screen h1 {
    font-size: clamp(36px, 8vw, 72px);
    color: #7fffd4;
    text-shadow: 0 0 30px #00bfff, 0 0 60px #00bfff;
    letter-spacing: 6px;
    margin-bottom: 8px;
    animation: pulse-glow 3s ease-in-out infinite;
  }
  @keyframes pulse-glow {
    0%,100% { text-shadow: 0 0 20px #00bfff, 0 0 40px #00bfff; }
    50% { text-shadow: 0 0 40px #00ffaa, 0 0 80px #00ffaa, 0 0 120px #00bfff; }
  }
  .screen .tagline {
    color: rgba(100,200,255,0.6);
    font-size: clamp(12px, 2vw, 16px);
    letter-spacing: 4px;
    margin-bottom: 50px;
    text-align: center;
    padding: 0 20px;
  }
  .btn {
    background: transparent;
    border: 1px solid rgba(0,191,255,0.5);
    color: #7fffd4;
    padding: 14px 48px;
    font-size: 16px;
    letter-spacing: 4px;
    cursor: pointer;
    text-transform: uppercase;
    font-family: 'Georgia', serif;
    transition: all 0.3s;
    margin: 6px;
    pointer-events: all;
  }
  .btn:hover {
    background: rgba(0,191,255,0.15);
    border-color: #00bfff;
    box-shadow: 0 0 20px rgba(0,191,255,0.4);
    color: #fff;
  }
  .hint-text {
    color: rgba(100,200,255,0.35);
    font-size: 12px;
    letter-spacing: 2px;
    margin-top: 40px;
    text-align: center;
    line-height: 1.8;
  }
  #gameover-screen .score-block {
    margin: 20px 0 40px;
    text-align: center;
  }
  #gameover-screen .score-block span {
    display: block;
    color: rgba(100,200,255,0.5);
    font-size: 12px;
    letter-spacing: 3px;
  }
  #gameover-screen .score-block .big {
    font-size: clamp(32px, 6vw, 56px);
    color: #7fffd4;
    text-shadow: 0 0 20px #00bfff;
    letter-spacing: 4px;
  }
  #gameover-screen .score-block .high {
    font-size: 14px;
    color: rgba(127,255,212,0.6);
    margin-top: 4px;
  }
  #pause-screen h2 {
    font-size: 32px;
    color: #7fffd4;
    letter-spacing: 6px;
    margin-bottom: 40px;
    text-shadow: 0 0 20px #00bfff;
  }
  #light-toggle-hint {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(100,200,255,0.35);
    font-size: 11px;
    letter-spacing: 2px;
    text-align: center;
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <!-- HUD -->
  <div id="hud">
    <div class="bar-label">Energy</div>
    <div class="bar-container"><div id="energy-bar"></div></div>
  </div>
  <div id="score-display">
    <span class="score-val" id="score-val">0</span>
    <span class="timer-val" id="timer-val">0:00</span>
  </div>
  <div id="light-toggle-hint">SPACE · toggle light &nbsp;|&nbsp; WASD / arrows · move</div>

  <!-- Title Screen -->
  <div class="screen" id="title-screen">
    <h1>DEEP LURE</h1>
    <p class="tagline">Your light attracts everything.<br>Everything is hungry.</p>
    <button class="btn" id="start-btn">Descend</button>
    <p class="hint-text">
      WASD / Arrows to swim &nbsp;·&nbsp; SPACE to toggle light<br>
      Eat small fish · Avoid predators · Survive
    </p>
  </div>

  <!-- Game Over Screen -->
  <div class="screen hidden" id="gameover-screen">
    <h1>CONSUMED</h1>
    <div class="score-block">
      <span>SCORE</span>
      <span class="big" id="final-score">0</span>
      <span class="high" id="high-score-display"></span>
    </div>
    <button class="btn" id="restart-btn">Dive Again</button>
  </div>

  <!-- Pause Screen -->
  <div class="screen hidden" id="pause-screen">
    <h2>PAUSED</h2>
    <button class="btn" id="resume-btn">Resume</button>
  </div>
</div>

<script>
'use strict';

// ─── Canvas setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── State ───────────────────────────────────────────────────────────────────
const STATE = { TITLE: 0, PLAYING: 1, PAUSED: 2, DEAD: 3 };
let state = STATE.TITLE;

// ─── Input ───────────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); handleLightToggle(); }
  if (e.code === 'Escape' || e.code === 'KeyP') handlePause();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Touch controls
let touchDir = { x: 0, y: 0 };
let touchActive = false;
let touchId = null;
let touchOrigin = { x: 0, y: 0 };
let lightDoubleTap = { last: 0 };

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (touchId === null) {
      touchId = t.identifier;
      touchOrigin = { x: t.clientX, y: t.clientY };
      touchActive = true;
    }
  }
  // Double-tap to toggle light
  const now = performance.now();
  if (now - lightDoubleTap.last < 300) handleLightToggle();
  lightDoubleTap.last = now;
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touchId) {
      const dx = t.clientX - touchOrigin.x;
      const dy = t.clientY - touchOrigin.y;
      const len = Math.sqrt(dx*dx + dy*dy);
      const max = 60;
      touchDir.x = len > 4 ? dx / Math.max(len, max) : 0;
      touchDir.y = len > 4 ? dy / Math.max(len, max) : 0;
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touchId) {
      touchId = null;
      touchActive = false;
      touchDir = { x: 0, y: 0 };
    }
  }
}, { passive: false });

function handleLightToggle() {
  if (state === STATE.PLAYING) player.lightOn = !player.lightOn;
}
function handlePause() {
  if (state === STATE.PLAYING) { state = STATE.PAUSED; showScreen('pause-screen'); }
  else if (state === STATE.PAUSED) { state = STATE.PLAYING; hideScreen('pause-screen'); }
}

// ─── Audio context (Web Audio API – synthesized sounds) ──────────────────────
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playEat() {
  try {
    const ac = getAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.frequency.setValueAtTime(220, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(440, ac.currentTime + 0.08);
    gain.gain.setValueAtTime(0.2, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.18);
    osc.start(); osc.stop(ac.currentTime + 0.18);
  } catch(e) {}
}

function playDamage() {
  try {
    const ac = getAudio();
    const bufSize = ac.sampleRate * 0.2;
    const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random()*2-1) * (1 - i/bufSize);
    const src = ac.createBufferSource();
    const gain = ac.createGain();
    const filter = ac.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 400;
    src.buffer = buf;
    src.connect(filter); filter.connect(gain); gain.connect(ac.destination);
    gain.gain.setValueAtTime(0.3, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.2);
    src.start();
  } catch(e) {}
}

function playDeath() {
  try {
    const ac = getAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, ac.currentTime + 1.2);
    gain.gain.setValueAtTime(0.25, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 1.2);
    osc.start(); osc.stop(ac.currentTime + 1.2);
  } catch(e) {}
}

// Ambient drone
let ambientStarted = false;
function startAmbient() {
  if (ambientStarted) return;
  try {
    const ac = getAudio();
    const freqs = [40, 55, 82];
    freqs.forEach(f => {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.connect(gain); gain.connect(ac.destination);
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.value = 0.04;
      osc.start();
    });
    ambientStarted = true;
  } catch(e) {}
}

// ─── Utility ─────────────────────────────────────────────────────────────────
const rand  = (a, b) => a + Math.random() * (b - a);
const randI = (a, b) => Math.floor(rand(a, b));
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const dist  = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const lerp  = (a, b, t) => a + (b - a) * t;

// ─── World / camera ──────────────────────────────────────────────────────────
const WORLD = 3000;  // world is larger than screen, camera follows player
let camX = 0, camY = 0;

// ─── Particles ───────────────────────────────────────────────────────────────
const particles = [];
function spawnParticles(x, y, count, color, speed, life) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = rand(speed * 0.3, speed);
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life, maxLife: life,
      color, r: rand(1, 3)
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha * 0.8;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x - camX, p.y - camY, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ─── Ambient particles (floating specks) ────────────────────────────────────
const ambientParticles = [];
function initAmbientParticles() {
  ambientParticles.length = 0;
  for (let i = 0; i < 120; i++) {
    ambientParticles.push({
      x: Math.random() * WORLD,
      y: Math.random() * WORLD,
      vx: rand(-4, 4),
      vy: rand(-2, 2),
      r: rand(0.5, 2),
      alpha: rand(0.05, 0.25),
      pulse: Math.random() * Math.PI * 2
    });
  }
}

function updateAmbientParticles(dt) {
  for (const p of ambientParticles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.pulse += dt * rand(0.5, 1.5);
    // Wrap
    if (p.x < 0) p.x += WORLD;
    if (p.x > WORLD) p.x -= WORLD;
    if (p.y < 0) p.y += WORLD;
    if (p.y > WORLD) p.y -= WORLD;
  }
}

function drawAmbientParticles() {
  for (const p of ambientParticles) {
    const sx = p.x - camX;
    const sy = p.y - camY;
    if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
    const a = p.alpha * (0.7 + 0.3 * Math.sin(p.pulse));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#7fffd4';
    ctx.beginPath();
    ctx.arc(sx, sy, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ─── Rocks ───────────────────────────────────────────────────────────────────
const rocks = [];
function initRocks(difficulty) {
  rocks.length = 0;
  const count = 40 + Math.floor(difficulty * 20);
  for (let i = 0; i < count; i++) {
    const n = randI(6, 10);
    const verts = [];
    for (let j = 0; j < n; j++) verts.push(rand(0.60, 1.0));
    rocks.push({
      x: rand(50, WORLD - 50),
      y: rand(50, WORLD - 50),
      r: rand(20, 58),
      angle: Math.random() * Math.PI * 2,
      points: n,
      verts
    });
  }
}

function buildRockPath(sx, sy, rock) {
  ctx.beginPath();
  for (let i = 0; i < rock.points; i++) {
    const a = rock.angle + (i / rock.points) * Math.PI * 2;
    const rx = sx + Math.cos(a) * rock.r * rock.verts[i];
    const ry = sy + Math.sin(a) * rock.r * rock.verts[i];
    i === 0 ? ctx.moveTo(rx, ry) : ctx.lineTo(rx, ry);
  }
  ctx.closePath();
}

function drawRocks(lightRadius) {
  for (const rock of rocks) {
    const sx = rock.x - camX;
    const sy = rock.y - camY;
    if (sx < -100 || sx > W + 100 || sy < -100 || sy > H + 100) continue;
    const d = dist(rock, player);
    const haloR = lightRadius * 1.75;
    if (d > haloR + rock.r + 20) continue;
    const mainAlpha = clamp((lightRadius + rock.r - d) / 80, 0, 0.88);
    const haloAlpha = clamp((haloR + rock.r - d) / 160, 0, 0.28);
    const alpha = Math.max(mainAlpha, haloAlpha);
    ctx.globalAlpha = alpha;

    // Gradient lit from player direction
    const lightDir = Math.atan2(player.y - rock.y, player.x - rock.x);
    const litX = sx + Math.cos(lightDir) * rock.r * 0.38;
    const litY = sy + Math.sin(lightDir) * rock.r * 0.38;
    const rg = ctx.createRadialGradient(litX, litY, 0, sx, sy, rock.r * 1.15);
    rg.addColorStop(0, '#1e4055');
    rg.addColorStop(0.45, '#0f2230');
    rg.addColorStop(1, '#050d16');
    ctx.fillStyle = rg;
    buildRockPath(sx, sy, rock);
    ctx.fill();

    // Crisp edge stroke — brighter on the lit side
    ctx.strokeStyle = `rgba(55,140,180,${alpha * 0.55})`;
    ctx.lineWidth = 1.8;
    ctx.stroke();

    // Inner bevel ring (inner polygon, no clip needed — 68% scale stays inside outer)
    ctx.beginPath();
    for (let i = 0; i < rock.points; i++) {
      const a = rock.angle + (i / rock.points) * Math.PI * 2;
      const rx = sx + Math.cos(a) * rock.r * rock.verts[i] * 0.68;
      const ry = sy + Math.sin(a) * rock.r * rock.verts[i] * 0.68;
      i === 0 ? ctx.moveTo(rx, ry) : ctx.lineTo(rx, ry);
    }
    ctx.closePath();
    ctx.strokeStyle = `rgba(35,90,120,${alpha * 0.3})`;
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.globalAlpha = 1;
  }
}

// ─── Player ──────────────────────────────────────────────────────────────────
const player = {
  x: WORLD / 2, y: WORLD / 2,
  vx: 0, vy: 0,
  energy: 100,
  lightOn: true,
  lightRadius: 0,      // animated
  targetLightRadius: 0,
  lureAngle: 0,
  lureGlow: 0,
  facingRight: true,
  invincible: 0,
  dead: false,
  w: 44, h: 24
};

const LIGHT_RADIUS_ON  = 220;
const LIGHT_RADIUS_OFF = 35;
const ENERGY_DRAIN_BASE = 1.5;   // per second passive
const ENERGY_DRAIN_LIGHT = 2;    // extra per second when light on
const MOVE_ACCEL = 750;
const FRICTION  = 0.87;

// ─── Prey fish ───────────────────────────────────────────────────────────────
const prey = [];
function spawnPrey(count) {
  for (let i = 0; i < count; i++) {
    prey.push(createPrey());
  }
}
function createPrey() {
  return {
    x: rand(20, WORLD - 20),
    y: rand(20, WORLD - 20),
    vx: rand(-40, 40),
    vy: rand(-20, 20),
    r: rand(5, 10),
    hue: randI(160, 210),
    wanderAngle: Math.random() * Math.PI * 2,
    wanderTimer: rand(0.5, 2),
    attracted: false,
    pulse: Math.random() * Math.PI * 2,
    energy: rand(10, 22)
  };
}

function updatePrey(dt, lightRadius) {
  for (let i = prey.length - 1; i >= 0; i--) {
    const f = prey[i];
    const d = dist(f, player);

    // Attraction to light
    if (player.lightOn && d < lightRadius * 1.8) {
      f.attracted = true;
    } else if (d > lightRadius * 2.5) {
      f.attracted = false;
    }

    if (f.attracted && d > 30) {
      const angle = Math.atan2(player.y - f.y, player.x - f.x);
      f.vx += Math.cos(angle) * 60 * dt;
      f.vy += Math.sin(angle) * 60 * dt;
    } else {
      // Wander
      f.wanderTimer -= dt;
      if (f.wanderTimer <= 0) {
        f.wanderAngle += rand(-1, 1);
        f.wanderTimer = rand(0.5, 2);
      }
      f.vx += Math.cos(f.wanderAngle) * 20 * dt;
      f.vy += Math.sin(f.wanderAngle) * 10 * dt;
    }

    const maxSpd = f.attracted ? 90 : 50;
    const spd = Math.hypot(f.vx, f.vy);
    if (spd > maxSpd) { f.vx = f.vx / spd * maxSpd; f.vy = f.vy / spd * maxSpd; }
    f.vx *= 0.92; f.vy *= 0.92;

    f.x += f.vx * dt; f.y += f.vy * dt;
    f.pulse += dt * 3;
    // Wrap world
    f.x = ((f.x % WORLD) + WORLD) % WORLD;
    f.y = ((f.y % WORLD) + WORLD) % WORLD;

    // Eat
    if (d < player.w * 0.55 + f.r) {
      spawnParticles(f.x, f.y, 8, `hsl(${f.hue},80%,65%)`, 60, 0.5);
      player.energy = Math.min(100, player.energy + f.energy);
      score += Math.floor(f.energy * 12);
      playEat();
      prey.splice(i, 1);
    }
  }
}

function drawPrey(lightRadius) {
  for (const f of prey) {
    const sx = f.x - camX;
    const sy = f.y - camY;
    if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
    const d = dist(f, player);
    const haloR = lightRadius * 1.75;
    const mainAlpha = clamp((lightRadius - d + f.r * 2 + 40) / 60, 0, 1);
    const haloAlpha = clamp((haloR - d + f.r * 2) / 160, 0, 0.22);
    const alpha = Math.max(mainAlpha, haloAlpha);
    if (alpha < 0.01) continue;
    ctx.globalAlpha = alpha;
    const glow = 0.5 + 0.5 * Math.sin(f.pulse);
    // Body
    ctx.fillStyle = `hsla(${f.hue},80%,${50 + glow * 20}%,1)`;
    ctx.beginPath();
    ctx.ellipse(sx, sy, f.r * 1.6, f.r, 0, 0, Math.PI * 2);
    ctx.fill();
    // Glow halo
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, f.r * 2.5);
    g.addColorStop(0, `hsla(${f.hue},90%,75%,0.4)`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(sx, sy, f.r * 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ─── Predators ───────────────────────────────────────────────────────────────
const predators = [];
function spawnPredator() {
  // Spawn at edge of world or far from player
  const angle = Math.random() * Math.PI * 2;
  const spawnDist = rand(W * 0.6, W * 0.9);
  let px = player.x + Math.cos(angle) * spawnDist;
  let py = player.y + Math.sin(angle) * spawnDist;
  px = clamp(px, 30, WORLD - 30);
  py = clamp(py, 30, WORLD - 30);
  predators.push({
    x: px, y: py,
    vx: 0, vy: 0,
    r: rand(28, 50),
    speed: rand(55, 85),
    aggression: rand(0.6, 1.0),
    detectRange: rand(280, 450),
    hue: randI(190, 240),
    alertness: 0,
    idleAngle: Math.random() * Math.PI * 2,
    idleTimer: rand(1, 3),
    pulse: Math.random() * Math.PI * 2,
    flashTimer: 0
  });
}

function updatePredators(dt, lightRadius, difficulty) {
  const baseDetect = player.lightOn ? 1.0 : 0.3;
  for (const pred of predators) {
    pred.pulse += dt * 1.2;
    pred.flashTimer = Math.max(0, pred.flashTimer - dt);
    const d = dist(pred, player);
    const effectiveRange = pred.detectRange * baseDetect * (1 + difficulty * 0.4);

    if (d < effectiveRange) {
      pred.alertness = Math.min(1, pred.alertness + dt * pred.aggression * (1 + difficulty * 0.5));
    } else {
      pred.alertness = Math.max(0, pred.alertness - dt * 0.5);
    }

    if (pred.alertness > 0.1) {
      const angle = Math.atan2(player.y - pred.y, player.x - pred.x);
      const spd = pred.speed * pred.alertness * (1 + difficulty * 0.3);
      pred.vx += Math.cos(angle) * spd * dt * 3;
      pred.vy += Math.sin(angle) * spd * dt * 3;
    } else {
      // Idle wander
      pred.idleTimer -= dt;
      if (pred.idleTimer <= 0) {
        pred.idleAngle += rand(-0.8, 0.8);
        pred.idleTimer = rand(1, 3);
      }
      pred.vx += Math.cos(pred.idleAngle) * 15 * dt;
      pred.vy += Math.sin(pred.idleAngle) * 8 * dt;
    }

    const maxSpd = pred.speed * (0.5 + pred.alertness * 0.8);
    const spd = Math.hypot(pred.vx, pred.vy);
    if (spd > maxSpd) { pred.vx = pred.vx / spd * maxSpd; pred.vy = pred.vy / spd * maxSpd; }
    pred.vx *= 0.9; pred.vy *= 0.9;
    pred.x += pred.vx * dt; pred.y += pred.vy * dt;
    pred.x = clamp(pred.x, 0, WORLD); pred.y = clamp(pred.y, 0, WORLD);

    // Hit player
    if (d < pred.r + 20 && player.invincible <= 0) {
      player.energy -= 28 + difficulty * 8;
      player.invincible = 1.8;
      screenShake(8, 0.4);
      pred.flashTimer = 0.3;
      playDamage();
      spawnParticles(player.x, player.y, 14, '#ff4466', 90, 0.7);
    }
  }
}

function drawPredators(lightRadius) {
  const t = performance.now() / 1000;
  for (const pred of predators) {
    const sx = pred.x - camX;
    const sy = pred.y - camY;
    if (sx < -120 || sx > W + 120 || sy < -120 || sy > H + 120) continue;
    const d = dist(pred, player);
    const visRange = lightRadius * 1.75 + pred.r * 2 + pred.alertness * 150;
    const alpha = clamp((visRange - d) / 120, 0, 1);
    if (alpha < 0.01) continue;

    ctx.globalAlpha = alpha;

    const glow        = 0.5 + 0.5 * Math.sin(pred.pulse);
    const flashBright = pred.flashTimer > 0 ? 0.8 : 0;
    const hue         = pred.hue + flashBright * 160;
    const inLight     = clamp((lightRadius - d + pred.r) / pred.r, 0, 1);
    const lightL      = 7 + inLight * 16 + flashBright * 28;
    const lightS      = 30 + inLight * 22;

    const spd     = Math.hypot(pred.vx, pred.vy);
    const swimI   = clamp(spd / 60, 0, 1);
    const tailWag = Math.sin(t * 3.2 + pred.pulse * 2) * (0.18 + swimI * 0.28);
    const moveAngle = Math.atan2(pred.vy, pred.vx) || 0;
    const r = pred.r;

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(moveAngle);

    // ── Caudal (tail) fin ──
    ctx.save();
    ctx.translate(-r * 1.05, 0);
    ctx.rotate(tailWag);
    ctx.fillStyle = `hsl(${hue},${lightS - 5}%,${lightL - 2}%)`;
    // upper lobe
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.06);
    ctx.bezierCurveTo(-r * 0.18, -r * 0.28, -r * 0.42, -r * 0.62, -r * 0.48, -r * 0.72);
    ctx.bezierCurveTo(-r * 0.28, -r * 0.46, -r * 0.08, -r * 0.22, 0, -r * 0.06);
    ctx.fill();
    // lower lobe (slightly smaller)
    ctx.beginPath();
    ctx.moveTo(0,  r * 0.06);
    ctx.bezierCurveTo(-r * 0.18,  r * 0.24, -r * 0.36,  r * 0.52, -r * 0.40,  r * 0.60);
    ctx.bezierCurveTo(-r * 0.24,  r * 0.38, -r * 0.08,  r * 0.18, 0,  r * 0.06);
    ctx.fill();
    ctx.restore();

    // ── Pectoral fin ──
    ctx.fillStyle = `hsla(${hue},${lightS - 8}%,${lightL}%,0.72)`;
    ctx.beginPath();
    ctx.moveTo(r * 0.15, r * 0.22);
    ctx.bezierCurveTo(-r * 0.18, r * 0.55, -r * 0.52, r * 0.52, -r * 0.58, r * 0.28);
    ctx.bezierCurveTo(-r * 0.32, r * 0.12, r * 0.02, r * 0.10, r * 0.15, r * 0.22);
    ctx.fill();

    // ── Main body (streamlined teardrop) ──
    const bdg = ctx.createLinearGradient(-r * 0.9, -r * 0.3, r * 0.9, r * 0.3);
    bdg.addColorStop(0,   `hsl(${hue},${lightS - 8}%,${lightL - 2}%)`);
    bdg.addColorStop(0.45,`hsl(${hue},${lightS}%,${lightL + 5}%)`);
    bdg.addColorStop(1,   `hsl(${hue},${lightS - 5}%,${lightL}%)`);
    ctx.fillStyle = bdg;
    ctx.beginPath();
    ctx.moveTo(r * 1.08, 0);
    ctx.bezierCurveTo(r * 0.95, -r * 0.40, r * 0.10, -r * 0.54, -r * 0.58, -r * 0.40);
    ctx.bezierCurveTo(-r * 0.98, -r * 0.22, -r * 0.98,  r * 0.22, -r * 0.58,  r * 0.40);
    ctx.bezierCurveTo(r * 0.10,  r * 0.54, r * 0.95,  r * 0.40, r * 1.08, 0);
    ctx.fill();

    // Lateral line (definition stripe)
    if (inLight > 0.2) {
      ctx.strokeStyle = `hsla(${hue + 15},55%,${lightL + 10}%,${inLight * 0.22})`;
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(r * 0.7, 0);
      ctx.bezierCurveTo(r * 0.2, -r * 0.18, -r * 0.35, -r * 0.14, -r * 0.72, 0);
      ctx.stroke();
    }

    // ── Dorsal fin ──
    ctx.fillStyle = `hsla(${hue},${lightS - 4}%,${lightL + 2}%,0.82)`;
    ctx.beginPath();
    ctx.moveTo(-r * 0.08, -r * 0.42);
    ctx.bezierCurveTo(r * 0.12, -r * 0.78, r * 0.56, -r * 0.68, r * 0.66, -r * 0.38);
    ctx.bezierCurveTo(r * 0.45, -r * 0.44, r * 0.06, -r * 0.44, -r * 0.08, -r * 0.42);
    ctx.fill();

    // ── Eye ──
    const ex = r * 0.68, ey = -r * 0.14;
    ctx.fillStyle = `rgba(205,235,255,${0.75 + glow * 0.25})`;
    ctx.beginPath();
    ctx.arc(ex, ey, r * 0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(ex, ey, r * 0.09, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(ex + r * 0.04, ey - r * 0.04, r * 0.04, 0, Math.PI * 2);
    ctx.fill();

    // ── Alert eye glow ──
    if (pred.alertness > 0.25) {
      const eg = pred.alertness * (0.65 + 0.35 * glow);
      const gg = ctx.createRadialGradient(ex, ey, 0, ex, ey, r * 0.55);
      gg.addColorStop(0, `hsla(${hue + 20},95%,72%,${eg * 0.55})`);
      gg.addColorStop(1, 'transparent');
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.arc(ex, ey, r * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

// ─── Screen shake ────────────────────────────────────────────────────────────
let shakeAmt = 0, shakeDur = 0, shakeTimer = 0;
function screenShake(amt, dur) {
  shakeAmt = amt; shakeDur = dur; shakeTimer = dur;
}
let shakeOffX = 0, shakeOffY = 0;
function updateShake(dt) {
  if (shakeTimer > 0) {
    shakeTimer -= dt;
    const t = shakeTimer / shakeDur;
    shakeOffX = (Math.random() * 2 - 1) * shakeAmt * t;
    shakeOffY = (Math.random() * 2 - 1) * shakeAmt * t;
  } else {
    shakeOffX = 0; shakeOffY = 0;
  }
}

// ─── Game vars ───────────────────────────────────────────────────────────────
let score = 0;
let survivalTime = 0;
let highScore = (() => { try { return parseInt(localStorage.getItem('deepLureHS') || '0'); } catch(e) { return 0; } })();
let difficulty = 0;
let predSpawnTimer = 0;
let preySpawnTimer = 0;
let gameOverTimer = 0;

// ─── Player drawing ──────────────────────────────────────────────────────────
function drawPlayer() {
  const sx = W / 2;
  const sy = H / 2;
  const t  = performance.now() / 1000;
  const blink = player.invincible > 0 && Math.sin(t * 20) > 0;
  if (blink) return;

  const spd = Math.hypot(player.vx, player.vy);
  const swimI = clamp(spd / 220, 0, 1);

  // Animation values
  const mouthAmt  = 0.16 + 0.10 * Math.abs(Math.sin(t * 1.5)) + swimI * 0.18;
  const tailWag   = Math.sin(t * 4.0 + swimI * Math.PI) * (0.14 + swimI * 0.22);
  const finFlap   = Math.sin(t * 3.4) * (0.28 + swimI * 0.38);

  ctx.save();
  ctx.translate(sx, sy);
  if (!player.facingRight) ctx.scale(-1, 1);

  const w = player.w, h = player.h;

  // ── Pectoral fin (drawn behind body) ──
  ctx.save();
  ctx.translate(w * 0.04, h * 0.18);
  ctx.rotate(finFlap * 0.55 + 0.15);
  ctx.fillStyle = 'rgba(12,46,65,0.80)';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(-3, h * 0.38, w * 0.08, h * 0.72, w * 0.22, h * 0.50);
  ctx.bezierCurveTo(w * 0.26, h * 0.28, w * 0.12, h * 0.08, 0, 0);
  ctx.fill();
  ctx.restore();

  // ── Main body ──
  const bg = ctx.createRadialGradient(0, -h * 0.1, 2, -w * 0.05, 0, w * 0.72);
  bg.addColorStop(0, '#1e4a5e');
  bg.addColorStop(0.5, '#112838');
  bg.addColorStop(1, '#090f18');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(-w * 0.42, -h * 0.20);
  ctx.bezierCurveTo(-w * 0.18, -h * 0.58, w * 0.08, -h * 0.56, w * 0.36, -h * 0.22);
  ctx.lineTo(w * 0.42, -h * 0.06);
  ctx.lineTo(w * 0.42,  h * 0.06);
  ctx.bezierCurveTo(w * 0.10,  h * 0.56, -w * 0.18,  h * 0.58, -w * 0.42,  h * 0.20);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(42,108,145,0.22)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // ── Dorsal fin ──
  ctx.fillStyle = 'rgba(14,50,70,0.88)';
  ctx.beginPath();
  ctx.moveTo(-w * 0.06, -h * 0.50);
  ctx.bezierCurveTo(w * 0.06, -h * 0.92, w * 0.26, -h * 0.80, w * 0.32, -h * 0.48);
  ctx.bezierCurveTo(w * 0.16, -h * 0.52, w * 0.0,  -h * 0.52, -w * 0.06, -h * 0.50);
  ctx.fill();

  // ── Animated tail ──
  ctx.save();
  ctx.translate(-w * 0.42, 0);
  ctx.rotate(tailWag);
  ctx.fillStyle = 'rgba(9,34,50,0.92)';
  // upper lobe
  ctx.beginPath();
  ctx.moveTo(0, -h * 0.04);
  ctx.bezierCurveTo(-w * 0.12, -h * 0.24, -w * 0.24, -h * 0.58, -w * 0.30, -h * 0.68);
  ctx.bezierCurveTo(-w * 0.16, -h * 0.42, -w * 0.04, -h * 0.18, 0, -h * 0.04);
  ctx.fill();
  // lower lobe
  ctx.beginPath();
  ctx.moveTo(0,  h * 0.04);
  ctx.bezierCurveTo(-w * 0.12,  h * 0.24, -w * 0.24,  h * 0.58, -w * 0.30,  h * 0.68);
  ctx.bezierCurveTo(-w * 0.16,  h * 0.42, -w * 0.04,  h * 0.18, 0,  h * 0.04);
  ctx.fill();
  ctx.restore();

  // ── Mouth (animated jaws with teeth) ──
  const mX = w * 0.14;   // jaw pivot x
  const mTip = w * 0.42; // snout tip

  // Upper jaw (rotates up)
  ctx.save();
  ctx.translate(mX, -h * 0.04);
  ctx.rotate(-mouthAmt * 0.65);
  ctx.fillStyle = '#0b1d28';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(mTip - mX, 0, mTip - mX + 4, -h * 0.08, mTip - mX, -h * 0.14);
  ctx.bezierCurveTo((mTip - mX) * 0.5, -h * 0.16, 0, -h * 0.08, 0, 0);
  ctx.fill();
  // upper teeth
  ctx.fillStyle = 'rgba(195,232,222,0.92)';
  const uspc = (mTip - mX - 4) / 4;
  for (let i = 0; i < 5; i++) {
    const tx = (mTip - mX - 2) - i * uspc;
    const tl = h * (i % 2 === 0 ? 0.15 : 0.09);
    ctx.beginPath();
    ctx.moveTo(tx - 2.2, 0);
    ctx.lineTo(tx, tl);
    ctx.lineTo(tx + 2.2, 0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // Lower jaw (rotates down)
  ctx.save();
  ctx.translate(mX, h * 0.04);
  ctx.rotate(mouthAmt * 0.85);
  ctx.fillStyle = '#0b1d28';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(mTip - mX, 0, mTip - mX + 3, h * 0.09, mTip - mX - 2, h * 0.16);
  ctx.bezierCurveTo((mTip - mX) * 0.4, h * 0.17, 0, h * 0.08, 0, 0);
  ctx.fill();
  // lower teeth (pointing up from lower jaw — drawn flipped)
  ctx.fillStyle = 'rgba(178,220,210,0.85)';
  const lspc = (mTip - mX - 6) / 3;
  for (let i = 0; i < 4; i++) {
    const tx = (mTip - mX - 4) - i * lspc;
    const tl = h * (i % 2 === 0 ? 0.12 : 0.08);
    ctx.beginPath();
    ctx.moveTo(tx - 2.5, 0);
    ctx.lineTo(tx, -tl);
    ctx.lineTo(tx + 2.5, 0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // ── Eye ──
  ctx.fillStyle = 'rgba(175,228,255,0.92)';
  ctx.beginPath();
  ctx.arc(w * 0.20, -h * 0.24, 4.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#00060e';
  ctx.beginPath();
  ctx.arc(w * 0.205, -h * 0.24, 3.0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.beginPath();
  ctx.arc(w * 0.215, -h * 0.265, 1.1, 0, Math.PI * 2);
  ctx.fill();

  // ── Lure stalk ──
  if (player.lightOn || player.lightRadius > 10) {
    const lureGlow = player.lureGlow;
    player.lureAngle = Math.sin(t * 2.2) * 0.35;
    const stalkX = w * 0.18;
    const stalkY = -h * 0.54;
    const lureX = stalkX + Math.cos(player.lureAngle - 1.3) * 26;
    const lureY = stalkY + Math.sin(player.lureAngle - 1.3) * 26;

    ctx.strokeStyle = 'rgba(25,78,105,0.72)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(stalkX, stalkY);
    ctx.quadraticCurveTo(stalkX + 6, stalkY - 11, lureX, lureY);
    ctx.stroke();

    const lureSize = 12 * lureGlow;
    const lg = ctx.createRadialGradient(lureX, lureY, 0, lureX, lureY, lureSize);
    lg.addColorStop(0,   `rgba(130,255,210,${lureGlow})`);
    lg.addColorStop(0.4, `rgba(60,200,180,${lureGlow * 0.5})`);
    lg.addColorStop(1, 'transparent');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.arc(lureX, lureY, lureSize + 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(220,255,240,${lureGlow})`;
    ctx.beginPath();
    ctx.arc(lureX, lureY, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// ─── Light rendering ─────────────────────────────────────────────────────────
function drawLight() {
  const sx = W / 2;
  const sy = H / 2;
  const r = player.lightRadius;
  const haloR = r * 1.75;
  const lureG = player.lureGlow;

  // Bloom ring drawn before darkness so it partially shows through the halo zone
  if (r > 30) {
    ctx.save();
    const bloom = ctx.createRadialGradient(sx, sy, r * 0.52, sx, sy, r * 1.6);
    const b1 = Math.floor(160 * lureG);
    const b2 = Math.floor(120 * lureG);
    const b3 = Math.floor(80 * lureG);
    const b4 = Math.floor(55 * lureG);
    bloom.addColorStop(0,    'rgba(0,0,0,0)');
    bloom.addColorStop(0.32, `rgba(0,${b1},${b2},${0.22 * lureG})`);
    bloom.addColorStop(0.58, `rgba(0,${b3},${b4},${0.10 * lureG})`);
    bloom.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = bloom;
    ctx.beginPath();
    ctx.arc(sx, sy, r * 1.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Darkness overlay — soft falloff leaves halo zone semi-transparent
  ctx.save();
  const darkOverlay = ctx.createRadialGradient(sx, sy, r * 0.15, sx, sy, haloR);
  darkOverlay.addColorStop(0,    'rgba(0,4,12,0)');
  darkOverlay.addColorStop(0.28, 'rgba(0,4,12,0.15)');
  darkOverlay.addColorStop(0.54, 'rgba(0,4,12,0.60)');
  darkOverlay.addColorStop(0.76, 'rgba(0,4,12,0.85)');
  darkOverlay.addColorStop(1,    'rgba(0,4,12,0.99)');
  ctx.fillStyle = darkOverlay;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // Additive halo ring highlight — glowing edge drawn on top of darkness
  if (r > 30) {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const ring = ctx.createRadialGradient(sx, sy, r * 0.78, sx, sy, r * 1.15);
    ring.addColorStop(0,   'rgba(0,0,0,0)');
    ring.addColorStop(0.4, `rgba(0,${Math.floor(100*lureG)},${Math.floor(80*lureG)},${0.09 * lureG})`);
    ring.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = ring;
    ctx.beginPath();
    ctx.arc(sx, sy, r * 1.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Inner bioluminescent core tint
    ctx.save();
    const intensity = r / LIGHT_RADIUS_ON;
    const core = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 0.72);
    core.addColorStop(0, `rgba(0,75,95,${0.12 * intensity})`);
    core.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(sx, sy, r * 0.72, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawBackground() {
  ctx.fillStyle = '#00030a';
  ctx.fillRect(0, 0, W, H);
}

// ─── Update player ────────────────────────────────────────────────────────────
function updatePlayer(dt) {
  let ax = 0, ay = 0;
  if (keys['ArrowLeft']  || keys['KeyA']) ax -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) ax += 1;
  if (keys['ArrowUp']    || keys['KeyW']) ay -= 1;
  if (keys['ArrowDown']  || keys['KeyS']) ay += 1;
  ax += touchDir.x;
  ay += touchDir.y;

  const len = Math.sqrt(ax * ax + ay * ay);
  if (len > 1) { ax /= len; ay /= len; }

  player.vx += ax * MOVE_ACCEL * dt;
  player.vy += ay * MOVE_ACCEL * dt;
  const spd = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
  const maxSpd = 290;
  if (spd > maxSpd) { player.vx = player.vx / spd * maxSpd; player.vy = player.vy / spd * maxSpd; }
  player.vx *= Math.pow(FRICTION, dt * 60);
  player.vy *= Math.pow(FRICTION, dt * 60);
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  player.x = clamp(player.x, 20, WORLD - 20);
  player.y = clamp(player.y, 20, WORLD - 20);

  if (player.vx > 5) player.facingRight = true;
  if (player.vx < -5) player.facingRight = false;

  // Energy drain
  const drain = ENERGY_DRAIN_BASE + (player.lightOn ? ENERGY_DRAIN_LIGHT : 0);
  player.energy -= drain * dt;
  player.energy = Math.max(0, player.energy);

  // Invincibility timer
  player.invincible = Math.max(0, player.invincible - dt);

  // Light radius animation
  player.targetLightRadius = player.lightOn ? LIGHT_RADIUS_ON : LIGHT_RADIUS_OFF;
  player.lightRadius = lerp(player.lightRadius, player.targetLightRadius, dt * 5);
  player.lureGlow = lerp(player.lureGlow, player.lightOn ? 1 : 0.05, dt * 6);
}

// ─── Rock collision ───────────────────────────────────────────────────────────
function checkRockCollisions() {
  if (player.invincible > 0) return;
  for (const rock of rocks) {
    const d = dist(rock, player);
    if (d < rock.r + 18) {
      player.energy -= 18;
      player.invincible = 1.2;
      screenShake(5, 0.3);
      playDamage();
      // Push away
      const angle = Math.atan2(player.y - rock.y, player.x - rock.x);
      player.vx += Math.cos(angle) * 120;
      player.vy += Math.sin(angle) * 120;
      spawnParticles(player.x, player.y, 8, '#2244aa', 70, 0.5);
      break;
    }
  }
}

// ─── Camera ───────────────────────────────────────────────────────────────────
function updateCamera() {
  const targetX = player.x - W / 2;
  const targetY = player.y - H / 2;
  camX = lerp(camX, targetX, 0.1);
  camY = lerp(camY, targetY, 0.1);
}

// ─── HUD ──────────────────────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('energy-bar').style.width = player.energy + '%';
  document.getElementById('score-val').textContent = score;
  const secs = Math.floor(survivalTime);
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  document.getElementById('timer-val').textContent = `${m}:${s.toString().padStart(2, '0')}`;
}

// ─── Screen management ────────────────────────────────────────────────────────
function showScreen(id) {
  const el = document.getElementById(id);
  el.style.display = 'flex';
  // Force reflow so the fade-in transition triggers
  el.getBoundingClientRect();
  el.style.opacity = '1';
  el.style.pointerEvents = 'all';
}
function hideScreen(id) {
  const el = document.getElementById(id);
  el.style.opacity = '0';
  el.style.pointerEvents = 'none';
  // Remove from layout after transition so it can't block anything
  const onEnd = () => { el.style.display = 'none'; el.removeEventListener('transitionend', onEnd); };
  el.addEventListener('transitionend', onEnd);
  // Fallback: if no transition fires, hide after 600ms
  setTimeout(() => { if (el.style.opacity === '0') el.style.display = 'none'; }, 600);
}

// ─── Init / Reset ─────────────────────────────────────────────────────────────
function initGame() {
  player.x = WORLD / 2; player.y = WORLD / 2;
  player.vx = 0; player.vy = 0;
  player.energy = 100;
  player.lightOn = true;
  player.lightRadius = LIGHT_RADIUS_ON;
  player.lureGlow = 1;
  player.invincible = 0;
  player.dead = false;
  player.facingRight = true;
  score = 0;
  survivalTime = 0;
  difficulty = 0;
  predSpawnTimer = 4;
  preySpawnTimer = 0;
  shakeTimer = 0;
  particles.length = 0;
  predators.length = 0;
  prey.length = 0;
  camX = player.x - W / 2;
  camY = player.y - H / 2;
  initRocks(0);
  initAmbientParticles();
  spawnPrey(18);
  spawnPredator();
  spawnPredator();
}

// ─── Game over ────────────────────────────────────────────────────────────────
function triggerDeath() {
  if (player.dead) return;
  player.dead = true;
  playDeath();
  screenShake(12, 0.8);
  spawnParticles(player.x, player.y, 30, '#00bfff', 100, 1.5);
  if (score > highScore) {
    highScore = score;
    try { localStorage.setItem('deepLureHS', highScore); } catch(e) {}
  }
  gameOverTimer = 1.5;
}

function showGameOver() {
  document.getElementById('final-score').textContent = score;
  const hs = document.getElementById('high-score-display');
  hs.textContent = score >= highScore ? '★ NEW HIGH SCORE ★' : `Best: ${highScore}`;
  showScreen('gameover-screen');
  state = STATE.DEAD;
}

// ─── Main loop ────────────────────────────────────────────────────────────────
let lastTime = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  if (state !== STATE.PLAYING) {
    // Still render while dead (for particles)
    if (state === STATE.DEAD) {
      drawBackground();
      ctx.save();
      ctx.translate(shakeOffX, shakeOffY);
      updateCamera();
      drawAmbientParticles();
      drawRocks(player.lightRadius);
      drawPrey(player.lightRadius);
      drawPredators(player.lightRadius);
      drawParticles();
      drawLight();
      ctx.restore();
      updateParticles(dt);
      updateShake(dt);
      if (gameOverTimer > 0) {
        gameOverTimer -= dt;
        if (gameOverTimer <= 0) showGameOver();
      }
    }
    return;
  }

  survivalTime += dt;
  difficulty = Math.min(3, survivalTime / 90);

  updateShake(dt);
  updatePlayer(dt);
  updateCamera();
  checkRockCollisions();
  updatePrey(dt, player.lightRadius);
  updatePredators(dt, player.lightRadius, difficulty);
  updateAmbientParticles(dt);
  updateParticles(dt);

  // Spawn management
  predSpawnTimer -= dt;
  if (predSpawnTimer <= 0) {
    const maxPred = 3 + Math.floor(difficulty * 3);
    if (predators.length < maxPred) spawnPredator();
    predSpawnTimer = Math.max(6, 14 - difficulty * 4);
  }
  preySpawnTimer -= dt;
  if (preySpawnTimer <= 0) {
    const maxPrey = Math.max(6, 18 - Math.floor(difficulty * 4));
    while (prey.length < maxPrey) prey.push(createPrey());
    preySpawnTimer = 2;
  }

  // Death check
  if (player.energy <= 0 && !player.dead) {
    triggerDeath();
    state = STATE.DEAD;
  }

  // Draw
  drawBackground();
  ctx.save();
  ctx.translate(shakeOffX, shakeOffY);

  drawAmbientParticles();
  drawRocks(player.lightRadius);
  drawPrey(player.lightRadius);
  drawPredators(player.lightRadius);
  drawParticles();
  drawLight();
  drawPlayer();

  ctx.restore();
  updateHUD();
}

// ─── Button bindings ──────────────────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', () => {
  startAmbient();
  // Hide title immediately — no transition needed, game canvas takes over instantly
  const titleEl = document.getElementById('title-screen');
  titleEl.style.display = 'none';
  titleEl.style.opacity  = '0';
  titleEl.style.pointerEvents = 'none';
  initGame();
  state = STATE.PLAYING;
  lastTime = performance.now();
});

document.getElementById('restart-btn').addEventListener('click', () => {
  hideScreen('gameover-screen');
  initGame();
  state = STATE.PLAYING;
  lastTime = performance.now();
});

document.getElementById('resume-btn').addEventListener('click', () => {
  hideScreen('pause-screen');
  state = STATE.PLAYING;
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(loop); });
</script>
</body>
</html>
