<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Deep Lure</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#000;
  display:flex; align-items:center; justify-content:center;
  width:100vw; height:100vh; overflow:hidden;
  font-family:'Courier New', monospace;
}
canvas {
  display:block;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ─── Canvas: fixed 16-bit logical resolution ─────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const LW = 480, LH = 270;   // logical resolution (16:9)
let   scale  = 1;

canvas.width  = LW;
canvas.height = LH;
ctx.imageSmoothingEnabled = false;

function resize() {
  scale = Math.min(window.innerWidth / LW, window.innerHeight / LH);
  canvas.style.width  = (LW * scale) + 'px';
  canvas.style.height = (LH * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ─── Palette ─────────────────────────────────────────────────────────────────
const C = {
  // Deep ocean background bands
  BG0:'#010407', BG1:'#010610', BG2:'#020a1a', BG3:'#031228', BG4:'#041830',

  // Anglerfish
  FR:'#cc2200',  // fish red
  FD:'#881400',  // fish dark red
  FL:'#ff4422',  // fish light red
  FP:'#aa1a00',  // fin / spine red
  EW:'#e8e8e0',  // eye white
  EB:'#000000',  // eye black
  TW:'#eeeee0',  // tooth white
  LY:'#ffee00',  // lure yellow
  LW2:'#ffffc0', // lure core
  LS:'#553322',  // lure stalk

  // Environment
  RD:'#11152a',  // rock dark
  RM:'#181e38',  // rock mid
  RL:'#202848',  // rock light
  CD:'#0c1e2e',  // coral dark
  CL:'#132638',  // coral light
  SWD:'#091e14', // seaweed dark
  SWL:'#0e2e1c', // seaweed light
  BUB:'#5588bb', // bubble
  SPK:'#2255aa', // speck
  SIL:'#10203a', // silhouette fish
};

// ─── Utilities ───────────────────────────────────────────────────────────────
const rand  = (a,b) => a + Math.random()*(b-a);
const randI = (a,b) => Math.floor(rand(a,b));
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi,v));

// Pixel-rect shorthand: draw a W×H block of S-scaled pixels at (x,y)
const S = 3; // "pixel" size in canvas pixels
function px(color, x, y, w, h) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x)*S, Math.round(y)*S, w*S, h*S);
}

// ─── Input ────────────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true;  e.preventDefault(); });
window.addEventListener('keyup',   e => { keys[e.code] = false; });

// Touch: track Y relative to logical canvas
let touchY = null;
const toLogicalY = clientY => (clientY - canvas.getBoundingClientRect().top) / scale;
canvas.addEventListener('touchstart', e => { touchY = toLogicalY(e.touches[0].clientY); e.preventDefault(); }, { passive:false });
canvas.addEventListener('touchmove',  e => { touchY = toLogicalY(e.touches[0].clientY); e.preventDefault(); }, { passive:false });
canvas.addEventListener('touchend',   e => { touchY = null; e.preventDefault(); }, { passive:false });

// ─── Persistence ─────────────────────────────────────────────────────────────
let highScore = (() => { try { return parseInt(localStorage.getItem('dlScore') || '0'); } catch(e) { return 0; } })();

// ─── Game state ───────────────────────────────────────────────────────────────
let gameState = 'title'; // 'title' | 'playing' | 'gameover'
let score      = 0;
let scrollX    = 0;   // total pixels scrolled (used for score + difficulty)
let scrollSpeed = 60; // px/s (logical)
let gameT      = 0;   // total play time in seconds

// ─── Player ──────────────────────────────────────────────────────────────────
const PLAYER_FIXED_X = 100; // fixed screen x
const player = {
  x: PLAYER_FIXED_X,
  y: LH / 2,
  vy: 0,
  animFrame:  0,
  animTimer:  0,
  animPeriod: 0.18, // seconds per tail frame
};
const ACCEL    = 140;  // px/s²
const MAX_VY   = 110;  // px/s
const FRICTION = 0.80; // per-frame factor (applied as pow each second)
const HALF_H   = 18;   // half-height for boundary clamping

// ─── Background layers ────────────────────────────────────────────────────────
// All elements stored in logical screen-space (x,y in logical pixels).
// Each frame: x -= scrollSpeed * layerSpeed * dt  →  recycle when x < -size.

const rocks      = [];
const corals     = [];
const seaweeds   = [];
const bubbles    = [];
const specks     = [];
const silhouettes = [];

function makeRock() {
  return {
    x:  rand(LW * 0.2, LW + 200),
    w:  rand(28, 90),
    h:  rand(15, 55),
    variant: randI(0, 3),
  };
}
function makeCoral() {
  return {
    x:    rand(LW * 0.3, LW + 150),
    h:    rand(14, 42),
    type: randI(0, 3),
  };
}
function makeSeaweed() {
  return {
    x:     rand(-5, LW + 5),
    h:     rand(16, 48),
    segs:  randI(3, 6),
    phase: rand(0, Math.PI * 2),
  };
}
function makeBubble(x) {
  return {
    x:     x !== undefined ? x : rand(0, LW),
    y:     rand(LH * 0.4, LH + 10),
    r:     rand(1, 3),
    rise:  rand(10, 28),
    drift: rand(-4, 4),
    alpha: rand(0.15, 0.45),
  };
}
function makeSpeck() {
  return {
    x:     rand(0, LW),
    y:     rand(0, LH),
    alpha: rand(0.04, 0.22),
    size:  Math.random() < 0.7 ? 1 : 2,
    speed: rand(0.3, 0.7),
  };
}
function makeSilhouette() {
  return {
    x:     rand(LW * 0.5, LW + 100),
    y:     rand(LH * 0.12, LH * 0.78),
    sz:    rand(6, 16),
    speed: rand(0.1, 0.35), // fraction of scroll speed
    alpha: rand(0.04, 0.12),
  };
}

function initLayers() {
  rocks.length = corals.length = seaweeds.length = 0;
  bubbles.length = specks.length = silhouettes.length = 0;

  for (let i = 0; i < 14; i++) rocks.push(makeRock());
  for (let i = 0; i < 10; i++) corals.push(makeCoral());
  for (let i = 0; i < 18; i++) seaweeds.push(makeSeaweed());
  for (let i = 0; i < 28; i++) bubbles.push(makeBubble());
  for (let i = 0; i < 45; i++) specks.push(makeSpeck());
  for (let i = 0; i <  8; i++) silhouettes.push(makeSilhouette());
}

// ─── Draw: Background gradient ───────────────────────────────────────────────
function drawBackground() {
  // Layered horizontal bands simulate deep-ocean depth gradient
  const bands = [
    [0,    0.10, C.BG0],
    [0.10, 0.25, C.BG1],
    [0.25, 0.50, C.BG2],
    [0.50, 0.75, C.BG3],
    [0.75, 1.00, C.BG4],
  ];
  for (const [t0, t1, col] of bands) {
    ctx.fillStyle = col;
    ctx.fillRect(0, Math.floor(t0 * LH), LW, Math.ceil((t1 - t0) * LH) + 1);
  }
}

// ─── Draw: Far rocks (bottom silhouette) ────────────────────────────────────
function drawRocks() {
  for (const r of rocks) {
    const bx = Math.round(r.x), by = LH;
    const rw = Math.round(r.w), rh = Math.round(r.h);
    switch (r.variant) {
      case 0:  // craggy boulder
        ctx.fillStyle = C.RM;
        ctx.fillRect(bx,             by - rh * 0.7, rw,         rh * 0.7);
        ctx.fillRect(bx + rw * 0.15, by - rh,       rw * 0.65,  rh * 0.35);
        ctx.fillRect(bx + rw * 0.30, by - rh * 1.1, rw * 0.35,  rh * 0.15);
        ctx.fillStyle = C.RL;
        ctx.fillRect(bx + 2, by - rh * 0.72, rw * 0.18, rh * 0.1);
        break;
      case 1:  // wide shelf
        ctx.fillStyle = C.RD;
        ctx.fillRect(bx,             by - rh * 0.5, rw,        rh * 0.5);
        ctx.fillRect(bx + rw * 0.1,  by - rh * 0.7, rw * 0.6,  rh * 0.25);
        ctx.fillStyle = C.RM;
        ctx.fillRect(bx + rw * 0.05, by - rh * 0.52, rw * 0.3, rh * 0.06);
        break;
      case 2:  // spire
        ctx.fillStyle = C.RM;
        ctx.fillRect(bx + rw * 0.35, by - rh,       rw * 0.30, rh);
        ctx.fillRect(bx + rw * 0.20, by - rh * 0.6, rw * 0.55, rh * 0.6);
        ctx.fillRect(bx,             by - rh * 0.3,  rw,        rh * 0.3);
        break;
    }
  }
}

// ─── Draw: Coral formations ──────────────────────────────────────────────────
function drawCoral() {
  for (const c of corals) {
    const bx = Math.round(c.x), by = LH, h = Math.round(c.h);
    switch (c.type) {
      case 0:  // branching
        ctx.fillStyle = C.CD;
        ctx.fillRect(bx,      by - h,       3, h);
        ctx.fillRect(bx - 5,  by - h * 0.7, 3, h * 0.5);
        ctx.fillRect(bx + 5,  by - h * 0.6, 3, h * 0.4);
        ctx.fillRect(bx + 10, by - h * 0.4, 3, h * 0.25);
        break;
      case 1:  // fan
        ctx.fillStyle = C.CL;
        for (let i = 0; i < 5; i++) {
          const fh = h * (0.35 + i * 0.13);
          ctx.fillRect(bx + i * 5 - 10, by - fh, 3, fh);
        }
        break;
      case 2:  // dome mound
        ctx.fillStyle = C.CD;
        ctx.fillRect(bx - 7, by - h * 0.85, 16, h * 0.85);
        ctx.fillStyle = C.CL;
        ctx.fillRect(bx - 5, by - h,         12, h * 0.2);
        ctx.fillRect(bx - 2, by - h * 1.1,    6, h * 0.12);
        break;
    }
  }
}

// ─── Draw: Seaweed ────────────────────────────────────────────────────────────
function drawSeaweed(t) {
  for (const sw of seaweeds) {
    const bx  = Math.round(sw.x);
    const segH = sw.h / sw.segs;
    for (let s = 0; s < sw.segs; s++) {
      const wave = Math.sin(t * 1.6 + sw.phase + s * 0.55) * (s + 1) * 1.8;
      const sy   = LH - s * segH;
      ctx.fillStyle = s % 2 === 0 ? C.SWD : C.SWL;
      ctx.fillRect(Math.round(bx + wave), Math.round(sy - segH), 4, Math.ceil(segH) + 1);
    }
  }
}

// ─── Draw: Bubbles ────────────────────────────────────────────────────────────
function drawBubbles() {
  for (const b of bubbles) {
    ctx.globalAlpha = b.alpha;
    ctx.fillStyle   = C.BUB;
    ctx.fillRect(Math.round(b.x), Math.round(b.y), Math.round(b.r * 2), Math.round(b.r * 2));
  }
  ctx.globalAlpha = 1;
}

// ─── Draw: Specks ────────────────────────────────────────────────────────────
function drawSpecks() {
  for (const s of specks) {
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle   = C.SPK;
    ctx.fillRect(Math.round(s.x), Math.round(s.y), s.size, s.size);
  }
  ctx.globalAlpha = 1;
}

// ─── Draw: Distant fish silhouettes ──────────────────────────────────────────
function drawSilhouettes() {
  for (const s of silhouettes) {
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle   = C.SIL;
    const bx = Math.round(s.x), by = Math.round(s.y), sz = Math.round(s.sz);
    ctx.fillRect(bx,         by,               sz,        sz * 0.55);
    ctx.fillRect(bx - sz*0.4, by + sz*0.05,    sz*0.45,   sz * 0.45);
  }
  ctx.globalAlpha = 1;
}

// ─── Draw: Anglerfish (pixel art, S=3 per "pixel") ───────────────────────────
// The fish faces RIGHT. Coordinate origin = center of body.
// All (x,y) values are in "pixel" units; canvas pixels = value * S.
function drawAnglerfish(cx, cy, frame, t) {
  // Convert logical-pixel center to "pixel-unit" origin for the px() helper.
  // px() uses Math.round(x)*S internally, so we must offset by cx/S, cy/S.
  // Easier: just shift ctx instead.
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy));

  // Alias that offsets from current transform origin in "pixel" units
  function p(col, dx, dy, dw, dh) {
    ctx.fillStyle = col;
    ctx.fillRect(dx*S, dy*S, dw*S, dh*S);
  }

  const tw = frame === 0 ? 0 : 1; // tail wag offset

  // ── TAIL (left, animated) ──────────────────────────────────────────────
  p(C.FD, -9, -4+tw,  4, 3);   // upper lobe
  p(C.FD, -8, -6+tw,  3, 2);
  p(C.FD, -9,  1-tw,  4, 3);   // lower lobe
  p(C.FD, -8,  3-tw,  3, 2);
  p(C.FD, -7, -2,     2, 5);   // root

  // ── DORSAL SPINES ──────────────────────────────────────────────────────
  p(C.FP, -3, -8,  2, 3);
  p(C.FP, -1,-10,  2, 4);
  p(C.FP,  2, -8,  2, 3);
  p(C.FP,  4, -6,  2, 2);

  // ── LURE STALK ─────────────────────────────────────────────────────────
  const lsway = Math.sin(t * 2.0) * 0.8; // gentle sway (sub-pixel)
  p(C.LS,  2, -8,  1, 2);
  p(C.LS,  3,-10,  1, 2);
  p(C.LS,  4,-12,  1, 2);
  p(C.LS,  4,-14,  1, 1);

  // Lure glow (soft radial gradient on top of pixel)
  const lureScreenX = Math.round(4.5 * S + lsway);
  const lureScreenY = Math.round(-14.5 * S);
  const glowR = 9 + 3 * Math.sin(t * 2.5);
  const glowG = ctx.createRadialGradient(lureScreenX, lureScreenY, 0, lureScreenX, lureScreenY, glowR);
  glowG.addColorStop(0,   'rgba(255,240, 80, 0.70)');
  glowG.addColorStop(0.4, 'rgba(255,200, 40, 0.30)');
  glowG.addColorStop(1,   'rgba(255,180,  0, 0.00)');
  ctx.fillStyle = glowG;
  ctx.beginPath(); ctx.arc(lureScreenX, lureScreenY, glowR, 0, Math.PI*2); ctx.fill();

  // Lure tip pixel
  p(C.LY,   4,-15,  2, 2);
  p(C.LW2,  4,-15,  1, 1);   // bright core

  // ── MAIN BODY ──────────────────────────────────────────────────────────
  p(C.FR, -6, -5, 13,  10); // core rect
  p(C.FR, -5, -6, 11,   1); // top row
  p(C.FR, -4, -7,  9,   1); // top peak
  p(C.FR, -5,  5, 11,   1); // bottom row
  p(C.FR, -4,  6,  9,   1); // bottom peak
  p(C.FR,  7, -4,  3,   8); // snout bulge

  // Highlight (upper-left of body)
  p(C.FL, -5, -6, 7,   2);
  p(C.FL, -4, -5, 5,   2);

  // Shadow (lower body)
  p(C.FD, -5,  4, 11,  3);
  p(C.FD, -4,  6,  9,  2);

  // ── PECTORAL FIN ───────────────────────────────────────────────────────
  p(C.FP, -3, 6,  8, 2);
  p(C.FP, -2, 7,  7, 2);
  p(C.FP, -1, 8,  5, 1);

  // ── UPPER JAW ──────────────────────────────────────────────────────────
  p(C.FD,  7, -5,  5, 3);
  p(C.FD,  8, -6,  4, 1);
  p(C.FD, 10, -3,  2, 2);

  // ── MOUTH VOID ─────────────────────────────────────────────────────────
  p(C.EB,  7, -1,  5, 5);     // darkness
  p(C.TW,  8, -1,  1, 2);     // upper teeth
  p(C.TW, 10, -1,  1, 2);
  p(C.TW,  8,  3,  1, 2);     // lower teeth
  p(C.TW, 10,  3,  1, 2);

  // ── LOWER JAW ──────────────────────────────────────────────────────────
  p(C.FD,  6,  4,  6, 3);
  p(C.FD,  7,  6,  5, 2);
  p(C.FD,  8,  7,  3, 1);

  // ── EYE ────────────────────────────────────────────────────────────────
  p(C.EW,  3, -5,  4, 4);     // white
  p(C.EB,  4, -4,  2, 2);     // pupil
  p(C.EW,  4, -4,  1, 1);     // specular

  // ── LATERAL LINE ───────────────────────────────────────────────────────
  p(C.FD, -5,  0, 12, 1);

  ctx.restore();
}

// ─── Draw: HUD ───────────────────────────────────────────────────────────────
function drawHUD() {
  const dist = Math.floor(scrollX / 100);

  // Left panel: score
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(4, 4, 112, 32);
  ctx.fillStyle = '#7abbdd';
  ctx.font = 'bold 9px "Courier New"';
  ctx.textBaseline = 'top';
  ctx.fillText('SCORE', 8, 7);
  ctx.fillStyle = '#88ccff';
  ctx.font = 'bold 11px "Courier New"';
  ctx.fillText(String(score).padStart(7,'0'), 8, 18);

  // Right panel: distance
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(LW - 84, 4, 80, 32);
  ctx.fillStyle = '#7abbdd';
  ctx.font = 'bold 9px "Courier New"';
  ctx.textAlign = 'right';
  ctx.fillText('DIST', LW - 8, 7);
  ctx.fillStyle = '#aaffcc';
  ctx.font = 'bold 11px "Courier New"';
  ctx.fillText(`${dist}m`, LW - 8, 18);

  // Best (small, below score)
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,0.40)';
  ctx.fillRect(4, 36, 112, 14);
  ctx.fillStyle = '#3a6688';
  ctx.font = '8px "Courier New"';
  ctx.fillText(`BEST ${String(highScore).padStart(7,'0')}`, 8, 38);

  ctx.textAlign    = 'left';
  ctx.textBaseline = 'alphabetic';
}

// ─── Draw: Title screen ───────────────────────────────────────────────────────
let titleBlink = 0;
function drawTitle(t) {
  ctx.fillStyle = 'rgba(0,2,8,0.75)';
  ctx.fillRect(0, 0, LW, LH);

  ctx.textAlign   = 'center';
  ctx.textBaseline = 'middle';

  // Drop shadow
  ctx.fillStyle = '#000000';
  ctx.font = 'bold 34px "Courier New"';
  ctx.fillText('DEEP LURE', LW/2+2, LH/2 - 58);
  // Title
  ctx.fillStyle = '#cc2200';
  ctx.fillText('DEEP LURE', LW/2, LH/2 - 60);

  // Subtitle
  ctx.font = '9px "Courier New"';
  ctx.fillStyle = '#335566';
  ctx.fillText('RETRO UNDERWATER ARCADE', LW/2, LH/2 - 34);

  // Controls
  ctx.font = '9px "Courier New"';
  ctx.fillStyle = '#2a5068';
  ctx.fillText('ARROW KEYS / WASD  ─  SWIM UP & DOWN', LW/2, LH/2 + 6);
  ctx.fillText('WORLD SCROLLS AUTOMATICALLY', LW/2, LH/2 + 20);

  // Blinking prompt
  titleBlink += 1/60;
  if (Math.sin(titleBlink * 4) > 0) {
    ctx.fillStyle = '#88eebb';
    ctx.font = 'bold 10px "Courier New"';
    ctx.fillText('PRESS ENTER OR TAP TO START', LW/2, LH/2 + 46);
  }

  ctx.font = '8px "Courier New"';
  ctx.fillStyle = '#1e3a4a';
  ctx.fillText(`BEST: ${highScore}`, LW/2, LH/2 + 68);

  ctx.textAlign    = 'left';
  ctx.textBaseline = 'alphabetic';
}

// ─── Draw: Game Over screen ───────────────────────────────────────────────────
let gameOverTimer = 0;
function drawGameOver() {
  ctx.fillStyle = 'rgba(0,1,4,0.82)';
  ctx.fillRect(0, 0, LW, LH);

  ctx.textAlign   = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#cc2200';
  ctx.font = 'bold 30px "Courier New"';
  ctx.fillText('GAME OVER', LW/2, LH/2 - 48);

  ctx.fillStyle = '#88ccff';
  ctx.font = '10px "Courier New"';
  ctx.fillText(`SCORE    ${String(score).padStart(7,'0')}`, LW/2, LH/2 - 14);
  ctx.fillText(`BEST     ${String(highScore).padStart(7,'0')}`, LW/2, LH/2 + 2);

  const dist = Math.floor(scrollX / 100);
  ctx.fillStyle = '#3a8866';
  ctx.font = '10px "Courier New"';
  ctx.fillText(`DISTANCE  ${dist}m`, LW/2, LH/2 + 18);

  gameOverTimer += 1/60;
  if (gameOverTimer > 1.5 && Math.sin(gameOverTimer * 4) > 0) {
    ctx.fillStyle = '#88eebb';
    ctx.font = 'bold 10px "Courier New"';
    ctx.fillText('PRESS ENTER OR TAP TO RESTART', LW/2, LH/2 + 50);
  }

  ctx.textAlign    = 'left';
  ctx.textBaseline = 'alphabetic';
}

// ─── Screen transitions ───────────────────────────────────────────────────────
function startGame() {
  score       = 0;
  scrollX     = 0;
  scrollSpeed = 60;
  gameT       = 0;
  player.y    = LH / 2;
  player.vy   = 0;
  player.animFrame = 0;
  player.animTimer = 0;
  gameOverTimer    = 0;
  initLayers();
  gameState = 'playing';
}

function endGame() {
  if (score > highScore) {
    highScore = score;
    try { localStorage.setItem('dlScore', highScore); } catch(e) {}
  }
  gameState = 'gameover';
}

// Keyboard: title/gameover transitions
window.addEventListener('keydown', e => {
  if (e.code === 'Enter') {
    if (gameState === 'title')    startGame();
    if (gameState === 'gameover' && gameOverTimer > 1.5) startGame();
  }
});
canvas.addEventListener('click', () => {
  if (gameState === 'title')    startGame();
  if (gameState === 'gameover' && gameOverTimer > 1.5) startGame();
});

// ─── Init ─────────────────────────────────────────────────────────────────────
initLayers();

// ─── Main loop ───────────────────────────────────────────────────────────────
let lastTime = 0;

function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  const t = ts / 1000; // absolute time for animations

  // ── Update ────────────────────────────────────────────────────────────────
  if (gameState === 'playing') {
    gameT += dt;

    // ─ Player vertical movement ─
    const goUp   = keys['ArrowUp']   || keys['KeyW'];
    const goDown = keys['ArrowDown'] || keys['KeyS'];

    if (goUp)   player.vy -= ACCEL * dt;
    if (goDown) player.vy += ACCEL * dt;

    // Touch: steer toward touch Y
    if (touchY !== null) {
      const diff = touchY - player.y;
      if (Math.abs(diff) > 4) {
        player.vy += Math.sign(diff) * ACCEL * dt;
      }
    }

    // Clamp + friction (frame-rate independent damping)
    player.vy  = clamp(player.vy, -MAX_VY, MAX_VY);
    player.vy *= Math.pow(FRICTION, dt * 60);
    player.y  += player.vy * dt;
    player.y   = clamp(player.y, HALF_H + 2, LH - HALF_H - 2);

    // ─ Tail animation ─
    player.animTimer -= dt;
    if (player.animTimer <= 0) {
      player.animFrame  = 1 - player.animFrame;
      player.animTimer  = player.animPeriod;
    }

    // ─ World scroll (gradually speeds up) ─
    scrollSpeed = 60 + gameT * 3.5;   // caps naturally around 60+3.5*∞ → use min
    scrollSpeed = Math.min(scrollSpeed, 200);
    scrollX    += scrollSpeed * dt;
    score       = Math.floor(scrollX / 8);

    // ─ Update rocks ─
    for (const r of rocks) {
      r.x -= scrollSpeed * 0.30 * dt;
      if (r.x + r.w < -10) {
        r.x      = LW + rand(10, 120);
        r.w      = rand(28, 90);
        r.h      = rand(15, 55);
        r.variant = randI(0, 3);
      }
    }

    // ─ Update coral ─
    for (const c of corals) {
      c.x -= scrollSpeed * 0.72 * dt;
      if (c.x < -40) {
        c.x    = LW + rand(10, 100);
        c.h    = rand(14, 42);
        c.type = randI(0, 3);
      }
    }

    // ─ Update seaweed ─
    for (const sw of seaweeds) {
      sw.x -= scrollSpeed * 0.90 * dt;
      if (sw.x < -5) {
        sw.x     = LW + rand(5, 50);
        sw.h     = rand(16, 48);
        sw.segs  = randI(3, 6);
        sw.phase = rand(0, Math.PI * 2);
      }
    }

    // ─ Update bubbles (rise + drift) ─
    for (const b of bubbles) {
      b.x -= scrollSpeed * 0.55 * dt;
      b.x += b.drift * dt;
      b.y -= b.rise  * dt;
      if (b.x < -5 || b.y < -8) {
        b.x     = rand(LW * 0.2, LW + 30);
        b.y     = rand(LH * 0.45, LH + 10);
        b.rise  = rand(10, 28);
        b.drift = rand(-4, 4);
        b.alpha = rand(0.15, 0.45);
      }
    }

    // ─ Update specks ─
    for (const s of specks) {
      s.x -= scrollSpeed * s.speed * dt;
      if (s.x < -2) {
        s.x     = LW + rand(2, 50);
        s.y     = rand(0, LH);
        s.alpha = rand(0.04, 0.22);
      }
    }

    // ─ Update silhouettes ─
    for (const s of silhouettes) {
      s.x -= scrollSpeed * s.speed * dt;
      if (s.x + s.sz * 2 < -5) {
        s.x     = LW + rand(20, 100);
        s.y     = rand(LH * 0.12, LH * 0.78);
        s.sz    = rand(6, 16);
        s.speed = rand(0.1, 0.35);
        s.alpha = rand(0.04, 0.12);
      }
    }
  }

  // ── Draw ──────────────────────────────────────────────────────────────────
  drawBackground();
  drawSilhouettes();
  drawRocks();
  drawSpecks();
  drawBubbles();
  drawCoral();
  drawSeaweed(t);

  if (gameState === 'playing') {
    drawAnglerfish(player.x, player.y, player.animFrame, t);
    drawHUD();
  }

  if (gameState === 'title') {
    // Show fish on title screen
    drawAnglerfish(LW * 0.62, LH * 0.52, Math.floor(t / 0.22) % 2, t);
    drawTitle(t);
  } else if (gameState === 'gameover') {
    drawGameOver();
  }
}

requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(loop); });
</script>
</body>
</html>
